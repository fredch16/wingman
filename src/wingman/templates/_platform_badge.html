<span class="platform-badge platform-badge-{{ comment.platform }}"
      aria-label="{{ comment.platform_label }} comment">
  {% if comment.platform == "instagram" %}
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5.25"></rect>
      <circle cx="12" cy="12" r="4.1"></circle>
      <circle class="platform-icon-dot" cx="17.45" cy="6.8" r="1.15"></circle>
    </svg>
  {% else %}
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.25" y="5" width="19.5" height="14" rx="4.25"></rect>
      <path class="platform-icon-play" d="m10 9 5.2 3-5.2 3z"></path>
    </svg>
  {% endif %}
  <span>{{ comment.platform_label }}</span>
</span>
